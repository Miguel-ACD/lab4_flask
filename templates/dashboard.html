{% extends "base.html" %}

{% block contenido %}
<section>
    <div class="fila-titulo">
        <h2>Usuarios</h2>
        <a class="boton" href="{{ url_for('crear_usuario') }}">Nuevo usuario</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for usuario in usuarios %}
                <tr>
                    <td>{{ usuario.id }}</td>
                    <td>{{ usuario.nombre }}</td>
                    <td>{{ usuario.email }}</td>
                    <td>{{ usuario.rol }}</td>
                    <td>
                        <a href="{{ url_for('editar_usuario', id=usuario.id) }}">Editar</a>
                        <form class="form-inline" method="post" action="{{ url_for('eliminar_usuario', id=usuario.id) }}" onsubmit="return confirm('Seguro que deseas eliminar este usuario?');">
                            <button class="link" type="submit">Eliminar</button>
                        </form>
                    </td>
                </tr>
            {% else %}
                <tr>
                    <td colspan="5">No hay usuarios registrados.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</section>
{% endblock %}
